server:
  port: ${SERVER_PORT:8096}

spring:
  application:
    name: aftersales-agent
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
  ai:
    mcp:
      client:
        enabled: false
        type: SYNC
        request-timeout: 30s
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            aftersales-tools:
              url: ${MCP_SERVER_URL:http://localhost:8097}
              endpoint: /mcp
  jackson:
    serialization:
      write-dates-as-timestamps: false

agent:
  clock: ${AGENT_CLOCK:system}
  llm:
    provider: ${AGENT_LLM_PROVIDER:auto}
    base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:deepseek-chat}
    temperature: 0.2
  retrieval:
    backend: memory
    top-k: 4
    candidate-k: 8
  tools:
    mode: local
  plan:
    allow-fallback: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    dev.striveh.aftersales: INFO
    agent.trace: INFO
