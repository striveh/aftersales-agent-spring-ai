services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aftersales
      POSTGRES_USER: aftersales
      POSTGRES_PASSWORD: aftersales
    ports:
      - "55432:5432"
    volumes:
      - aftersales-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aftersales -d aftersales"]
      interval: 5s
      timeout: 5s
      retries: 20

  mcp-server:
    build:
      context: .
      dockerfile: aftersales-mcp-server/Dockerfile
    environment:
      SERVER_PORT: "8097"
    ports:
      - "8097:8097"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8097'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: on-failure

  agent:
    build:
      context: .
      dockerfile: aftersales-agent/Dockerfile
    environment:
      SERVER_PORT: "8096"
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aftersales
      SPRING_DATASOURCE_USERNAME: aftersales
      SPRING_DATASOURCE_PASSWORD: aftersales
      MCP_SERVER_URL: http://mcp-server:8097
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
    ports:
      - "8096:8096"
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8096'"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: on-failure

volumes:
  aftersales-pg:
